name: CI
on: [push, pull_request]
permissions:
  contents: read
# Runners self-hosted ci-hetzner (ancien Hetzner 144.76.224.57, utilisateur dédié au projet)
# depuis le 21/10/2026, à la place des runners GitHub hébergés.
jobs:
  test:
    runs-on: [self-hosted, ci-hetzner]
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
